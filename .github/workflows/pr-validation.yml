name: pr-head-e2e

# On-demand validation of an UNMERGED cdk-terrain PR before it lands: build +
# pnpm pack cdktn-cli from the PR head and run the same suite against it. This is
# how you catch a TTY/UX regression in review instead of in the nightly after merge.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "cdk-terrain PR number to validate (head built locally)"
        required: true
      repo:
        description: "Source repo"
        required: false
        default: "open-constructs/cdk-terrain"

permissions:
  contents: read

jobs:
  pr-head:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout e2e repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout cdk-terrain PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repo }}
          ref: refs/pull/${{ inputs.pr }}/head
          path: cdk-terrain
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.7.5"
          terraform_wrapper: false
      - name: Provision PR head (build + pack cdktn-cli)
        env:
          CDKTN_MONOREPO: ${{ github.workspace }}/cdk-terrain
        run: node scripts/provision.mjs cdktn-prhead
      - name: Run e2e against PR head
        env:
          CLI_ID: cdktn-prhead
        run: pnpm test
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: svg-prhead-${{ matrix.os }}-pr${{ inputs.pr }}
          path: artifacts/
          if-no-files-found: ignore
